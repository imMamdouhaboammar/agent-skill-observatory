name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      # actions/checkout@v4 pinned SHA for supply-chain security
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python@v5 pinned SHA
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m compileall -q src
      - name: Verify database migrations
        env:
          SKILLOBS_DATABASE_URL: sqlite+pysqlite:///./migration-check.db
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest --cov=skill_observatory --cov-report=term-missing --cov-fail-under=80
