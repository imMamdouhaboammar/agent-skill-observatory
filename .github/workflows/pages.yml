name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/skill_observatory/web/**'
      - 'data/catalog.json'
      - 'data/stats.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh catalog']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p site
          cp src/skill_observatory/web/* site/ || true
          cp data/catalog.json site/catalog.json
          cp data/stats.json site/stats.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
