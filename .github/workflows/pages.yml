name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'src/skill_observatory/web/**'
      - 'data/catalog.json'
      - 'data/stats.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site
        run: |
          mkdir -p site
          cp src/skill_observatory/web/index.html src/skill_observatory/web/styles.css src/skill_observatory/web/app.js site/
          cp data/catalog.json site/catalog.json
          cp data/stats.json site/stats.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
