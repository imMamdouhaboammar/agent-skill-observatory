name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/skill_observatory/web/**'
      - 'data/catalog.json'
      - 'data/stats.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh catalog']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 — pinned SHA for supply-chain security
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Assemble static site
        run: |
          mkdir -p site
          # Copy web UI assets
          cp src/skill_observatory/web/* site/ || true
          # Overlay catalog data
          cp data/catalog.json site/catalog.json
          cp data/stats.json site/stats.json
          # AI/LLM discovery files
          cp llms-full.txt site/llms-full.txt 2>/dev/null || true
          # Security contact
          mkdir -p site/.well-known
          cp .well-known/security.txt site/.well-known/security.txt 2>/dev/null || true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
