name: Refresh catalog

on:
  schedule:
    # Every 15 minutes, offset from the top of the hour to reduce GitHub cron congestion.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/skill_observatory/**'
      - 'pyproject.toml'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:
    inputs:
      max_repositories:
        description: Maximum candidate repositories to inspect
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore history database cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
          restore-keys: |
            observatory-db-

      - name: Install observatory
        run: python -m pip install -e .

      - name: Apply database migrations
        env:
          SKILLOBS_DATABASE_URL: sqlite+pysqlite:///./.cache/observatory.db
        run: |
          mkdir -p .cache
          skillobs migrate

      - name: Scan candidate repositories
        env:
          SKILLOBS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX="${{ inputs.max_repositories || '50' }}"
          skillobs refresh \
            --database-url sqlite+pysqlite:///./.cache/observatory.db \
            --max-repositories "$MAX" | tee .cache/refresh-report.json

      - name: Publish catalog, Awesome path and README
        run: |
          skillobs publish \
            --database-url sqlite+pysqlite:///./.cache/observatory.db \
            --data-dir data \
            --readme README.md \
            --awesome AWESOME.md \
            --awesome-directory awesome/README.md

      - name: Add run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          stats = json.loads(Path('data/stats.json').read_text())
          refresh = json.loads(Path('data/refresh.json').read_text())
          print('## Agent Skill Observatory refresh')
          print()
          print(f"- Refreshed: `{refresh['generated_at']}`")
          print(f"- Indexed skills: **{stats['skills']}**")
          print(f"- Repositories: **{stats['repositories']}**")
          print(f"- Spec valid: **{stats['spec_valid']}**")
          print(f"- Security 85+: **{stats['security_85_plus']}**")
          print(f"- Score 80+: **{stats['score_80_plus']}**")
          PY

      - name: Commit generated catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md AWESOME.md awesome/README.md \
            data/catalog.json data/catalog.csv data/stats.json \
            data/repositories.json data/refresh.json
          if git diff --cached --quiet; then
            echo "No generated catalog changes"
            exit 0
          fi
          STATS="$(python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/stats.json').read_text())
          print(f"{s['skills']} skills / {s['repositories']} repos")
          PY
          )"
          git commit -m "data: refresh verified catalog ($STATS)"
          git push

      - name: Save history database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
