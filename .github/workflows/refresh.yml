name: Refresh catalog

on:
  schedule:
    # Every 15 minutes, offset from the top of the hour to reduce GitHub cron congestion.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/skill_observatory/**'
      - 'pyproject.toml'
      - '.github/workflows/refresh.yml'
      - '.github/workflows/bootstrap-catalog.yml'
  workflow_dispatch:
    inputs:
      max_repositories:
        description: Maximum candidate repositories to inspect
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: atomic-skill-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore history database cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
          restore-keys: |
            observatory-db-

      - name: Install observatory
        run: python -m pip install -e .

      - name: Apply database migrations
        env:
          SKILLOBS_DATABASE_URL: sqlite+pysqlite:///./.cache/observatory.db
        run: |
          mkdir -p .cache
          skillobs migrate

      - name: Scan candidate repositories
        env:
          SKILLOBS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          MAX="${{ inputs.max_repositories || '50' }}"
          skillobs refresh \
            --database-url sqlite+pysqlite:///./.cache/observatory.db \
            --max-repositories "$MAX" | tee .cache/refresh-report.json

      - name: Publish Skill events and materialized views
        env:
          SKILLOBS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          skillobs publish-events \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --database-url sqlite+pysqlite:///./.cache/observatory.db \
            --checkout-root . \
            --max-events 100 \
            --time-budget-seconds 420 | tee .cache/publication-report.json

      - name: Add run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print('## Agent Skill Observatory publication')
          print()
          refresh_path = Path('.cache/refresh-report.json')
          refresh = json.loads(refresh_path.read_text()) if refresh_path.exists() else {}
          print(f"- Repositories scanned: **{refresh.get('repositories_seen', 'unknown')}**")
          print(f"- Skills observed: **{refresh.get('skills_indexed', 'unknown')}**")
          report_path = Path('.cache/publication-report.json')
          if not report_path.exists():
              print('- Publication report was not produced')
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          print(f"- Events detected: **{report['events_detected']}**")
          print(f"- Events published: **{report['events_published']}**")
          print(f"- ADD: **{report['adds']}**")
          print(f"- UPDATE: **{report['updates']}**")
          print(f"- REINDEX: **{report['reindexes']}**")
          print(f"- REMOVE: **{report['removals']}**")
          print(f"- Conflicts retried: **{report['conflicts_retried']}**")
          print(f"- Remaining deferred count: **{report['events_deferred']}**")
          print(f"- Aggregate status: **{report.get('aggregate_status') or 'not-run'}**")
          print(f"- Failures: **{len(report['failures'])}**")
          print(f"- main before SHA: `{report.get('main_before') or 'unknown'}`")
          print(f"- main after SHA: `{report.get('main_after') or 'unknown'}`")
          PY

      - name: Save history database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
