name: Refresh catalog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      max_repositories:
        description: Maximum candidate repositories to inspect
        required: false
        default: '75'

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore history database cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
          restore-keys: |
            observatory-db-

      - run: python -m pip install -e .

      - name: Apply database migrations
        env:
          SKILLOBS_DATABASE_URL: sqlite+pysqlite:///./.cache/observatory.db
        run: |
          mkdir -p .cache
          skillobs migrate

      - name: Refresh verified catalog
        env:
          SKILLOBS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache data
          MAX="${{ inputs.max_repositories || '75' }}"
          skillobs refresh --database-url sqlite+pysqlite:///./.cache/observatory.db --max-repositories "$MAX"
          skillobs export data/catalog.json --format json --database-url sqlite+pysqlite:///./.cache/observatory.db
          skillobs export data/catalog.csv --format csv --database-url sqlite+pysqlite:///./.cache/observatory.db
          skillobs stats --output data/stats.json --database-url sqlite+pysqlite:///./.cache/observatory.db

      - name: Commit text catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/catalog.csv data/stats.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "data: refresh verified skill catalog"
          git push

      - name: Save history database cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
