name: Agent Skills Lint

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: agent-skills-lint
        uses: korya/avocetta@929eb003cee9720c690d31a1d5239115b4b14186 # askl v2.0.1

      - name: agent-skills-lint (fixtures)
        uses: korya/avocetta@929eb003cee9720c690d31a1d5239115b4b14186 # askl v2.0.1
        with:
          path: tests/fixtures/sample-skill
