name: Agent Skills Lint

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: agent-skills-lint
        uses: korya/avocetta@5f6f62668f0cfb4c49abc18206f8955765c2e54d # askl v1.0.3

      - name: agent-skills-lint (fixtures)
        uses: korya/avocetta@5f6f62668f0cfb4c49abc18206f8955765c2e54d # askl v1.0.3
        with:
          path: tests/fixtures/sample-skill
