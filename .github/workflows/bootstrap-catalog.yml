name: Bootstrap catalog

on:
  workflow_dispatch:
    inputs:
      max_repositories:
        description: Maximum candidate repositories to inspect in the delegated PR-gated refresh
        required: false
        default: '100'

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the PR-gated publisher
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_REPOSITORIES: ${{ inputs.max_repositories }}
        run: |
          set -o pipefail
          set -eu
          gh workflow run refresh.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f max_repositories="$MAX_REPOSITORIES"

      - name: Add bootstrap summary
        run: |
          {
            echo '## Agent Skill Observatory bootstrap'
            echo
            echo '- Publication mode: **delegated to Refresh catalog**'
            echo '- Direct writes to `main`: **disabled**'
            echo '- Generated patches: **one signed atomic PR at a time**'
            echo '- Requested repository scan limit: **${{ inputs.max_repositories }}**'
          } >> "$GITHUB_STEP_SUMMARY"
