name: Bootstrap catalog

on:
  workflow_dispatch:
    inputs:
      max_repositories:
        description: Maximum candidate repositories to inspect
        required: false
        default: '100'
      max_events:
        description: Compatibility input; PR-gated bootstrap proposes one event per run
        required: false
        default: '1'
      time_budget_seconds:
        description: Publication wall-clock budget in seconds
        required: false
        default: '2400'
      skip_scan:
        description: Publish from the restored observation database without rescanning repositories
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atomic-skill-publication
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore history database cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
          restore-keys: |
            observatory-db-

      - name: Install observatory
        run: python -m pip install -e .

      - name: Require cached observations for publish-only bootstrap
        if: ${{ inputs.skip_scan }}
        run: |
          if [ ! -s .cache/observatory.db ]; then
            echo "::error::skip_scan requires a restored observation database cache"
            exit 1
          fi

      - name: Apply database migrations
        env:
          SKILLOBS_DATABASE_URL: sqlite+pysqlite:///./.cache/observatory.db
        run: |
          mkdir -p .cache
          skillobs migrate

      - name: Scan bootstrap candidate set
        if: ${{ !inputs.skip_scan }}
        env:
          SKILLOBS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          MAX_REPOSITORIES="${{ inputs.max_repositories }}"
          skillobs refresh \
            --database-url sqlite+pysqlite:///./.cache/observatory.db \
            --max-repositories "$MAX_REPOSITORIES" | tee .cache/refresh-report.json

      - name: Create patch producer token
        id: producer-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PATCH_PRODUCER_APP_ID }}
          private-key: ${{ secrets.PATCH_PRODUCER_PRIVATE_KEY }}

      - name: Propose one bootstrap patch PR
        env:
          SKILLOBS_GITHUB_TOKEN: ${{ steps.producer-token.outputs.token }}
        run: |
          set -o pipefail
          TIME_BUDGET="${{ inputs.time_budget_seconds }}"
          # Replaces skillobs publish-events with PR-gated publication.
          python -m skill_observatory.pr_publication_cli \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --database-url sqlite+pysqlite:///./.cache/observatory.db \
            --checkout-root . \
            --max-events 1 \
            --time-budget-seconds "$TIME_BUDGET" | tee .cache/publication-report.json

      - name: Add bootstrap summary
        if: always()
        env:
          BOOTSTRAP_SKIP_SCAN: ${{ inputs.skip_scan }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          print('## Agent Skill Observatory PR-gated bootstrap')
          print()
          if os.getenv('BOOTSTRAP_SKIP_SCAN') == 'true':
              print('- Repository scan: **skipped; using restored observation database**')
          else:
              refresh_path = Path('.cache/refresh-report.json')
              refresh = json.loads(refresh_path.read_text()) if refresh_path.exists() else {}
              print(f"- Repositories scanned: **{refresh.get('repositories_seen', 'unknown')}**")
              print(f"- Skills observed: **{refresh.get('skills_indexed', 'unknown')}**")
          report_path = Path('.cache/publication-report.json')
          if not report_path.exists():
              print('- Publication report was not produced')
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          print(f"- Events detected: **{report['events_detected']}**")
          print(f"- Event patch PRs proposed: **{report['events_published']}**")
          print(f"- Deferred count: **{report['events_deferred']}**")
          print(f"- Aggregate proposal status: **{report.get('aggregate_status') or 'not-run'}**")
          print(f"- Failures: **{len(report['failures'])}**")
          print(f"- main before SHA: `{report.get('main_before') or 'unknown'}`")
          print(f"- main after SHA: `{report.get('main_after') or 'unknown'}`")
          PY

      - name: Save history database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/observatory.db
          key: observatory-db-${{ github.run_id }}
