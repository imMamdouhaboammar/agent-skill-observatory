name: Dependency Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Detect dependency manifest changes
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$CHANGED_FILES"
          if grep -Eq '(^|/)(pyproject\.toml|poetry\.lock|Pipfile|Pipfile\.lock|uv\.lock|setup\.py|setup\.cfg|requirements[^/]*\.txt)$' <<< "$CHANGED_FILES"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes detected; dependency graph review is not applicable to this PR."
          fi

      - name: Require dependency graph availability for dependency changes
        if: steps.dependencies.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/sbom.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Dependency graph is unavailable (HTTP $STATUS). Dependency Review is a required release gate and must fail closed for dependency-changing PRs."
            exit 1
          fi

      - name: Review dependency changes
        if: steps.dependencies.outputs.changed == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
