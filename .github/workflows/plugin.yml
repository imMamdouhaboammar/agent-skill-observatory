name: ChatGPT & Codex Plugin Autopilot

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ChatGPT & Codex Plugin Autopilot
        uses: imMamdouhaboammar/chatgpt-codex-plugin-autopilot@v0.7.0
        with:
          path: '.'
          action: 'auto'
          output-dir: 'dist'
          fail-on-error: 'true'
          summary: 'true'
