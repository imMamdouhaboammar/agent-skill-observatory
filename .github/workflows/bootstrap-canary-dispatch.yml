name: Dispatch bootstrap canary

on:
  push:
    branches: [main]
    paths:
      - '.github/bootstrap-canary.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the real bootstrap workflow with canary limits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bootstrap-catalog.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f max_repositories=100 \
            -f max_events=25 \
            -f time_budget_seconds=2400
