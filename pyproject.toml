[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-observatory"
version = "0.2.0"
description = "Evidence-based discovery, validation, security analysis and ranking for open Agent Skills."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Mamdouh Aboammar", email = "mamdouhfces1997@gmail.com"}
]
maintainers = [
  {name = "Mamdouh Aboammar", email = "mamdouhfces1997@gmail.com"}
]
keywords = [
  "agent-skills",
  "ai-agents",
  "claude-code",
  "antigravity",
  "cursor",
  "codex",
  "security",
  "observatory",
  "static-analysis",
  "omni-skill",
  "multi-agent",
  "gemini-cli",
  "opencode",
  "skills-sh",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0.43,<3",
  "typer>=0.21,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://imMamdouhaboammar.github.io/agent-skill-observatory/"
Repository = "https://github.com/imMamdouhaboammar/agent-skill-observatory"
Documentation = "https://github.com/imMamdouhaboammar/agent-skill-observatory#readme"
"Bug Tracker" = "https://github.com/imMamdouhaboammar/agent-skill-observatory/issues"
Changelog = "https://github.com/imMamdouhaboammar/agent-skill-observatory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
skillobs = "skill_observatory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_observatory = ["web/*", "alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "typer.Option",
  "typer.Argument",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["skill_observatory"]
