[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-observatory"
version = "0.1.0"
description = "Evidence-based discovery, validation, security analysis and ranking for open Agent Skills."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Agent Skill Observatory contributors"}]
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0.43,<3",
  "typer>=0.21,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
skillobs = "skill_observatory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_observatory = ["web/*", "alembic/*.py", "alembic/*.mako", "alembic/versions/*.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["skill_observatory"]
