services:
  observatory:
    build: .
    ports:
      - "8000:8000"
    environment:
      SKILLOBS_DATABASE_URL: sqlite+pysqlite:////data/skill_observatory.db
      SKILLOBS_GITHUB_TOKEN: ${SKILLOBS_GITHUB_TOKEN:-}
    volumes:
      - observatory-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  observatory-data:
